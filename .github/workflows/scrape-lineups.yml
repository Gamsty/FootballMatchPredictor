name: Scrape lineups (DISABLED)

# DISABLED 2026-05-14 — sofascore returns 403 Forbidden behind their
# Cloudflare wall regardless of cloudscraper attempts. The fingerprint
# checks they layer on top of the standard JS challenge can't be bypassed
# without a real browser (playwright), and we don't want a headless
# browser stack in the container for marginal feature gain.
#
# To re-enable lineup data we'd need one of:
#   - api-football paid tier ($10-20/mo) — see api_football_client.py
#   - fotmob unofficial API integration (untested)
#   - playwright-based scraper (~5x container memory)
#
# Keeping the workflow file as a stub so the on-disk infra-as-code reflects
# what we intend; the empty `on:` block means it never triggers. To
# re-enable, restore the schedule + workflow_dispatch triggers below and
# swap sofascore_scraper.py for an alternative source.

on:
  # No triggers — workflow stays in repo but never fires.
  workflow_dispatch:
    inputs:
      enabled:
        description: 'Set to "yes" to confirm you understand sofascore is blocked'
        required: true
        default: 'no'

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger lineup scrape
        env:
          RELOAD_TOKEN: ${{ secrets.RELOAD_TOKEN }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$RELOAD_TOKEN" ] || [ -z "$BACKEND_URL" ]; then
            echo "Missing RELOAD_TOKEN or BACKEND_URL — skipping."
            exit 1
          fi
          response=$(curl -fsS -X POST "$BACKEND_URL/api/admin/scrape-lineups" \
            -H "X-Reload-Token: $RELOAD_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"hours": 6}')
          echo "Response: $response"
