name: Scrape lineups

# Sofascore posts pre-match lineups ~1h before kickoff. We poll every 30min
# in a 6h pre-kickoff window so we (a) cache the event_id resolution well in
# advance and (b) re-fetch into the final hour when the confirmed lineup
# replaces the predicted one.
#
# Most runs are no-ops — lineup endpoint returns None until sofascore posts
# something. The scraper handles None gracefully; only fetched/scraped runs
# do DB writes.
#
# Quota: sofascore is free but rate-limited. We respect 1.5s between requests
# inside the scraper. A typical run touches ~5-15 matches → ~10-25s on the
# happy path. GH Actions runner is well within its 6h limit.

on:
  schedule:
    - cron: '*/30 * * * *'   # every 30 minutes
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scrape:
    runs-on: ubuntu-latest
    steps:
      - name: Trigger lineup scrape
        env:
          RELOAD_TOKEN: ${{ secrets.RELOAD_TOKEN }}
          BACKEND_URL: ${{ secrets.BACKEND_URL }}
        run: |
          if [ -z "$RELOAD_TOKEN" ] || [ -z "$BACKEND_URL" ]; then
            echo "Missing RELOAD_TOKEN or BACKEND_URL — skipping."
            exit 1
          fi
          response=$(curl -fsS -X POST "$BACKEND_URL/api/admin/scrape-lineups" \
            -H "X-Reload-Token: $RELOAD_TOKEN" \
            -H "Content-Type: application/json" \
            -d '{"hours": 6}')
          echo "Response: $response"
