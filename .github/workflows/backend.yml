name: Backend CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'backend/**'
      - '.github/workflows/backend.yml'
  pull_request:
    paths:
      - 'backend/**'
  workflow_dispatch:

permissions:
  id-token: write   # OIDC token for Azure login
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: password
          POSTGRES_DB: football_predictor_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: backend/requirements.txt

      - name: Install dependencies
        working-directory: backend
        run: |
          pip install -r requirements.txt
          pip install ruff pytest

      - name: Lint
        working-directory: backend
        run: ruff check src/

      - name: Run tests
        working-directory: backend
        env:
          DATABASE_URL: postgresql://postgres:password@localhost:5432/football_predictor_test
        # --passed=0 disabled so pytest exits 0 if no tests are collected (avoids
        # "no tests collected" failure during early bootstrap), but any actual
        # test failure or error WILL fail the job.
        run: pytest -q --no-header || ([ $? -eq 5 ] && echo "No tests collected yet" || exit $?)

  build-and-deploy:
    needs: test
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Azure login (OIDC)
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to ACR
        run: az acr login --name ${{ secrets.AZURE_ACR_NAME }}

      - name: Build and push image
        uses: docker/build-push-action@v5
        with:
          context: ./backend
          push: true
          tags: |
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/fotballpred-backend:${{ github.sha }}
            ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/fotballpred-backend:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ secrets.AZURE_CA_NAME }} \
            --resource-group ${{ secrets.AZURE_RG }} \
            --image ${{ secrets.AZURE_ACR_NAME }}.azurecr.io/fotballpred-backend:${{ github.sha }}

      - name: Smoke test
        run: |
          APP_URL=$(az containerapp show \
            --name ${{ secrets.AZURE_CA_NAME }} \
            --resource-group ${{ secrets.AZURE_RG }} \
            --query properties.configuration.ingress.fqdn -o tsv)

          for i in {1..30}; do
            if curl -sf "https://$APP_URL/api/health" | grep -q '"status":"healthy"'; then
              echo "Smoke test passed"
              exit 0
            fi
            echo "Attempt $i: not healthy yet, waiting..."
            sleep 10
          done

          echo "Smoke test failed"
          exit 1
